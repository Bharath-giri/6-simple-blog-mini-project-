<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a Simple Blog account.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <title>Register - Simple Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📝 Simple Blog</h1>
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">☰</button>
        <nav id="site-nav">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <div class="auth-container">
            <h2>Create New Account</h2>
            <form id="register-form">
                <label for="register-username">Username</label>
                <input id="register-username" type="text" placeholder="Choose a username" autocomplete="username" minlength="3" required>
                <p class="field-hint">At least 3 characters.</p>

                <label for="register-password">Password</label>
                <div class="password-field">
                    <input id="register-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
                    <button type="button" class="toggle-password" data-toggle-password="register-password" aria-label="Show password">Show</button>
                </div>

                <label for="confirm-password">Confirm Password</label>
                <div class="password-field">
                    <input id="confirm-password" type="password" placeholder="Enter password again" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-toggle-password="confirm-password" aria-label="Show password">Show</button>
                </div>

                <button class="publish-btn" type="submit">Register</button>
            </form>
            <p id="register-message" role="alert"></p>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
