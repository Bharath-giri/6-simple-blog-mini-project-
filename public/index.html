<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple blog — read posts, register an account, and publish your own.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
    <title>Simple Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📝 Simple Blog</h1>
        <button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">☰</button>
        <nav id="site-nav">
            <a href="index.html">Home</a>
            <a href="new-post.html">New Post</a>
            <a href="login.html" id="login-link">Login</a>
            <a href="register.html" id="register-link">Register</a>
            <button id="logout-btn" class="logout-btn hidden">Logout</button>
        </nav>
    </header>

    <main>
        <div class="page-heading">
            <h2>All Blog Posts</h2>
            <a class="new-post-btn" href="new-post.html">+ New Post</a>
        </div>

        <div class="search-bar">
            <input id="search-input" type="search" placeholder="Search posts by title, author, or content…" aria-label="Search posts">
        </div>

        <div id="posts-container" aria-live="polite"></div>
        <div id="load-more-wrap"></div>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
